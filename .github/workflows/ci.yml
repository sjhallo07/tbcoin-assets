name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "*.json"
      - "*.png"
      - "*.md"
  pull_request:
    branches: [ main, master ]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "*.json"
      - "*.png"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  noop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: echo "Static assets repo: no build"
