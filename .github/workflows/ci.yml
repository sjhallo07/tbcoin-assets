name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "assets/**"
      - "package.json"
  pull_request:
    branches: [ main, master ]
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "assets/**"
      - "package.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build --if-present
